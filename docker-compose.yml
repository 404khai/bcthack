version: "3.9"

services:
  task_a:
    build:
      context: .
      dockerfile: task_a/Dockerfile
    env_file:
      - .env
    environment:
      PYTHONPATH: /app
      CHROMA_PERSIST_DIR: /app/chroma_db
      DATA_DIR: /app/data
      SERVICE_PORT: 8001
    command: uvicorn task_a.main:app --host 0.0.0.0 --port 8001
    ports:
      - "8001:8001"
    volumes:
      - .:/app
      - ./data:/app/data
      - ./chroma_db:/app/chroma_db
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health')"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  task_b:
    build:
      context: .
      dockerfile: task_b/Dockerfile
    env_file:
      - .env
    environment:
      PYTHONPATH: /app
      CHROMA_PERSIST_DIR: /app/chroma_db
      DATA_DIR: /app/data
      SERVICE_PORT: 8002
    command: uvicorn task_b.main:app --host 0.0.0.0 --port 8002
    ports:
      - "8002:8002"
    volumes:
      - .:/app
      - ./data:/app/data
      - ./chroma_db:/app/chroma_db
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8002/health')"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
